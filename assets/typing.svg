<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 50" width="500" height="50" role="img" aria-labelledby="typing-title">
  <title id="typing-title">Pratap Aher – Animated Role Typing</title>
  <defs>
    <!-- Cyan to Indigo/Violet gradient for role texts -->
    <linearGradient id="role-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Clip Paths for Typewriter reveal effect -->
    <clipPath id="clip-role-1">
      <rect x="0" y="0" height="50" width="0">
        <animate attributeName="width" 
                 values="0; 0; 255; 255; 0; 0" 
                 keyTimes="0; 0.02; 0.20; 0.70; 0.88; 1" 
                 dur="16s" repeatCount="indefinite" begin="0s" />
      </rect>
    </clipPath>
    <clipPath id="clip-role-2">
      <rect x="0" y="0" height="50" width="0">
        <animate attributeName="width" 
                 values="0; 0; 260; 260; 0; 0" 
                 keyTimes="0; 0.27; 0.45; 0.70; 0.88; 1" 
                 dur="16s" repeatCount="indefinite" begin="0s" />
      </rect>
    </clipPath>
    <clipPath id="clip-role-3">
      <rect x="0" y="0" height="50" width="0">
        <animate attributeName="width" 
                 values="0; 0; 265; 265; 0; 0" 
                 keyTimes="0; 0.52; 0.70; 0.70; 0.88; 1" 
                 dur="16s" repeatCount="indefinite" begin="0s" />
      </rect>
    </clipPath>
    <clipPath id="clip-role-4">
      <rect x="0" y="0" height="50" width="0">
        <animate attributeName="width" 
                 values="0; 0; 255; 255; 0; 0" 
                 keyTimes="0; 0.77; 0.95; 0.70; 0.88; 1" 
                 dur="16s" repeatCount="indefinite" begin="0s" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .terminal-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .prompt {
      fill: #10B981;
    }
  </style>

  <!-- Canvas background matching dark profile palette -->
  <rect width="500" height="50" fill="#050816" rx="8" />

  <!-- Prompt indicator -->
  <text x="18" y="31" class="terminal-text prompt">&gt;</text>

  <!-- Animated Text Blocks -->
  <g transform="translate(38, 0)">
    <!-- Role 1: Cyber Security Student -->
    <g clip-path="url(#clip-role-1)">
      <animate attributeName="opacity" values="1; 1; 1; 1; 1; 0; 0" keyTimes="0; 0.20; 0.24; 0.25; 0.99; 1" dur="16s" repeatCount="indefinite" begin="0s"/>
      <text x="0" y="31" class="terminal-text" fill="url(#role-grad)">Cyber Security Student</text>
    </g>

    <!-- Role 2: Python &amp; AI Security Dev -->
    <g clip-path="url(#clip-role-2)">
      <animate attributeName="opacity" values="0; 1; 1; 1; 1; 0; 0" keyTimes="0; 0.24; 0.25; 0.49; 0.50; 0.99; 1" dur="16s" repeatCount="indefinite" begin="0s"/>
      <text x="0" y="31" class="terminal-text" fill="url(#role-grad)">Python &amp; AI Security Dev</text>
    </g>

    <!-- Role 3: Open Source Contributor -->
    <g clip-path="url(#clip-role-3)">
      <animate attributeName="opacity" values="0; 1; 1; 1; 1; 0; 0" keyTimes="0; 0.49; 0.50; 0.74; 0.75; 0.99; 1" dur="16s" repeatCount="indefinite" begin="0s"/>
      <text x="0" y="31" class="terminal-text" fill="url(#role-grad)">Open Source Contributor</text>
    </g>

    <!-- Role 4: CTF Player &amp; Specialist -->
    <g clip-path="url(#clip-role-4)">
      <animate attributeName="opacity" values="0; 1; 1; 1; 1" keyTimes="0; 0.74; 0.75; 0.99; 1" dur="16s" repeatCount="indefinite" begin="0s"/>
      <text x="0" y="31" class="terminal-text" fill="url(#role-grad)">CTF Player &amp; Specialist</text>
    </g>

    <!-- Caret / Cursor: Blinks and follows the typing width -->
    <g>
      <!-- Horizontal translation animation following the typing path -->
      <animateTransform attributeName="transform" type="translate"
                        values="
                          0, 0;
                          0, 0;
                          255, 0;
                          255, 0;
                          0, 0;
                          0, 0;
                          
                          0, 0;
                          260, 0;
                          260, 0;
                          0, 0;
                          0, 0;
                          
                          0, 0;
                          265, 0;
                          265, 0;
                          0, 0;
                          0, 0;
                          
                          0, 0;
                          255, 0;
                          255, 0;
                          0, 0;
                          0, 0
                        "
                        keyTimes="
                          0;
                          0.02;
                          0.20;
                          0.23;
                          0.245;
                          0.25;
                          
                          0.27;
                          0.45;
                          0.48;
                          0.495;
                          0.50;
                          
                          0.52;
                          0.70;
                          0.73;
                          0.745;
                          0.75;
                          
                          0.77;
                          0.95;
                          0.98;
                          0.995;
                          1
                        "
                        dur="16s" repeatCount="indefinite" begin="0s" />
      
      <rect x="5" y="14" width="9" height="20" fill="#22D3EE">
        <!-- Caret blink animation -->
        <animate attributeName="opacity" values="1; 0; 1" dur="0.8s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
