<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="icon-linkedin-glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="icon-linkedin-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#0A66C2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="icon-linkedin-glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .icon-bg {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .icon-bg:hover {
      fill: rgba(255, 255, 255, 0.06);
      stroke: #0A66C2;
      filter: drop-shadow(0 0 6px #0A66C250);
    }
    .icon-symbol {
      transition: transform 0.3s;
    }
    .icon-bg:hover + .icon-symbol {
      transform: scale(1.1);
    }
  </style>

  <!-- Background glow -->
  <circle cx="20" cy="20" r="19" fill="url(#icon-linkedin-glow-grad)" opacity="0.8" pointer-events="none" />

  <!-- Glass circle button -->
  <circle class="icon-bg" cx="20" cy="20" r="19.2" fill="url(#icon-linkedin-glass-grad)" stroke="url(#icon-linkedin-border-grad)" stroke-width="1" />

