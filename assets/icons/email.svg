<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Email Icon">
  <defs>
    <!-- Light Mode Gradients -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="border-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Dark Mode Gradients -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="border-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glowing effect (Very subtle Gmail red-tinted glow) -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EA4335" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#EA4335" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .icon-bg {
      fill: url(#bg-light);
      stroke: url(#border-light);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .icon-symbol {
      fill: #334155;
      transition: fill 0.3s, transform 0.3s;
    }
    
    @media (prefers-color-scheme: dark) {
      .icon-bg {
        fill: url(#bg-dark);
        stroke: url(#border-dark);
      }
      .icon-symbol {
        fill: #F1F5F9;
      }
    }

    .icon-bg:hover {
      stroke: #EA4335;
    }
  </style>

  <!-- Faint background glow -->
  <circle cx="20" cy="20" r="19" fill="url(#glow)" pointer-events="none" />

  <!-- Card Body -->
  <circle class="icon-bg" cx="20" cy="20" r="18.4" stroke-width="1.2" />

  <!-- Icon Symbol (Centered inside 24x24 box scaled at translate 8, 8) -->
  <g class="icon-symbol" transform-origin="20 20" transform="translate(8, 8) scale(1)">
    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
  </g>
</svg>
