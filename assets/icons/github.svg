<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="GitHub Icon">
  <defs>
    <!-- Light Mode Gradients -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="border-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Dark Mode Gradients -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="border-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glowing effect (Very subtle) -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181717" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#181717" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .icon-bg {
      fill: url(#bg-light);
      stroke: url(#border-light);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .icon-symbol {
      fill: #334155;
      transition: fill 0.3s, transform 0.3s;
    }
    
    @media (prefers-color-scheme: dark) {
      .icon-bg {
        fill: url(#bg-dark);
        stroke: url(#border-dark);
      }
      .icon-symbol {
        fill: #F1F5F9;
      }
    }

    .icon-bg:hover {
      stroke: #181717;
    }
  </style>

  <!-- Faint background glow -->
  <circle cx="20" cy="20" r="19" fill="url(#glow)" pointer-events="none" />

  <!-- Card Body -->
  <circle class="icon-bg" cx="20" cy="20" r="18.4" stroke-width="1.2" />

  <!-- Icon Symbol (Centered inside 24x24 box scaled at translate 8, 8) -->
  <g class="icon-symbol" transform-origin="20 20" transform="translate(8, 8) scale(1)">
    <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.579.688.481C19.137 20.162 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
  </g>
</svg>