<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40" role="img" aria-label="Tailwind Badge">
  <defs>
    <!-- Light Mode Gradients -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="border-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Dark Mode Gradients -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="border-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glowing effect (Very subtle) -->
    <radialGradient id="glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .badge-bg {
      fill: url(#bg-light);
      stroke: url(#border-light);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .badge-text {
      font-family: 'Geist', 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #334155;
      transition: fill 0.3s;
    }
    
    @media (prefers-color-scheme: dark) {
      .badge-bg {
        fill: url(#bg-dark);
        stroke: url(#border-dark);
      }
      .badge-text {
        fill: #F1F5F9;
      }
    }

    /* Soft hover transitions */
    .badge-bg:hover {
      stroke: #06B6D4;
      fill-opacity: 0.9;
    }
  </style>

  <!-- Faint background glow -->
  <rect x="0" y="0" width="140" height="40" rx="10" fill="url(#glow)" pointer-events="none" />

  <!-- Card Body -->
  <rect class="badge-bg" x="0.6" y="0.6" width="138.8" height="38.8" rx="9.4" stroke-width="1.2" />

  <!-- Logo (Centered inside a 24x24 box scaled at x=14, y=8) -->
  <g transform="translate(14, 8) scale(1)">
    <path fill="#38BDF8" d="M12 6.018C12 3.799 13.8 2 16.02 2c1.24 0 2.37.56 3.12 1.48L12.58 11.4c-.66.82-1.63 1.3-2.66 1.3-1.12 0-2.12-.55-2.73-1.4L12 6.018zm-6.02 6C5.98 9.799 7.78 8 10.02 8c1.24 0 2.37.56 3.12 1.48L6.58 17.4c-.66.82-1.63 1.3-2.66 1.3-1.12 0-2.12-.55-2.73-1.4L5.98 12.018z"/>
  </g>

  <!-- Label -->
  <text class="badge-text" x="44" y="24">Tailwind</text>
</svg>