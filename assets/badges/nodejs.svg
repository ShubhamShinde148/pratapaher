<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40">
  <defs>
    <linearGradient id="badge-nodejs-glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="badge-nodejs-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#5FA04E" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="badge-nodejs-glow-grad" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#5FA04E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#5FA04E" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .badge-bg {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .badge-bg:hover {
      fill: rgba(255, 255, 255, 0.06);
      stroke: #5FA04E;
      filter: drop-shadow(0 0 6px #5FA04E50);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #E2E8F0;
      transition: fill 0.3s;
    }
    .badge-bg:hover + text {
      fill: #FFFFFF;
    }
  </style>
  
  <!-- Background glow -->
  <rect x="0" y="0" width="140" height="40" rx="8" fill="url(#badge-nodejs-glow-grad)" opacity="0.8" pointer-events="none" />
  
  <!-- Outer glass panel -->
  <rect class="badge-bg" x="0.5" y="0.5" width="139" height="39" rx="7.5" fill="url(#badge-nodejs-glass-grad)" stroke="url(#badge-nodejs-border-grad)" stroke-width="1" />
  
  <!-- Icon Wrapper -->
  <g transform="translate(14, 10) scale(0.85)">
    <path fill="#5FA04E" d="M12 2L4 6.5v9L12 20l8-4.5v-9L12 2zm6 12.3l-6 3.4-6-3.4V7.7l6-3.4 6 3.4v6.6zM11 7h2v6.5h-2V7z"/>
  </g>
  
  <!-- Text Label -->
  <text class="badge-text" x="42" y="25">Node.js</text>
</svg>
