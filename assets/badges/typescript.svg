<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40">
  <defs>
    <linearGradient id="badge-typescript-glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="badge-typescript-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#3178C6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="badge-typescript-glow-grad" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3178C6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3178C6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .badge-bg {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .badge-bg:hover {
      fill: rgba(255, 255, 255, 0.06);
      stroke: #3178C6;
      filter: drop-shadow(0 0 6px #3178C650);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #E2E8F0;
      transition: fill 0.3s;
    }
    .badge-bg:hover + text {
      fill: #FFFFFF;
    }
  </style>
  
  <!-- Background glow -->
  <rect x="0" y="0" width="140" height="40" rx="8" fill="url(#badge-typescript-glow-grad)" opacity="0.8" pointer-events="none" />
  
  <!-- Outer glass panel -->
  <rect class="badge-bg" x="0.5" y="0.5" width="139" height="39" rx="7.5" fill="url(#badge-typescript-glass-grad)" stroke="url(#badge-typescript-border-grad)" stroke-width="1" />
  
  <!-- Icon Wrapper -->
  <g transform="translate(14, 10) scale(0.85)">
    <rect width="24" height="24" rx="3" fill="#3178C6"/><path fill="#FFF" d="M12.5 17.8c0 1.5-.8 2.3-2.3 2.3-1.3 0-2.1-.6-2.4-1.5l1.2-.7c.2.5.5.8 1.1.8.5 0 .8-.3.8-.8v-6.2h1.6v6.1zm6.7-5.5h-4.8v1.3h1.6v4.8h1.6v-4.8h1.6v-1.3z" transform="scale(0.85) translate(2, 2)"/>
  </g>
  
  <!-- Text Label -->
  <text class="badge-text" x="42" y="25">TypeScript</text>
</svg>
