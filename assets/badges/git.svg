<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40">
  <defs>
    <linearGradient id="badge-git-glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="badge-git-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#F05032" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="badge-git-glow-grad" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F05032" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F05032" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .badge-bg {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .badge-bg:hover {
      fill: rgba(255, 255, 255, 0.06);
      stroke: #F05032;
      filter: drop-shadow(0 0 6px #F0503250);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #E2E8F0;
      transition: fill 0.3s;
    }
    .badge-bg:hover + text {
      fill: #FFFFFF;
    }
  </style>
  
  <!-- Background glow -->
  <rect x="0" y="0" width="140" height="40" rx="8" fill="url(#badge-git-glow-grad)" opacity="0.8" pointer-events="none" />
  
  <!-- Outer glass panel -->
  <rect class="badge-bg" x="0.5" y="0.5" width="139" height="39" rx="7.5" fill="url(#badge-git-glass-grad)" stroke="url(#badge-git-border-grad)" stroke-width="1" />
  
  <!-- Icon Wrapper -->
  <g transform="translate(14, 10) scale(0.85)">
    <path fill="#F05032" d="M23.3 10.9L13.1.7C12.7.3 12 .3 11.6.7L8.9 3.4l3.2 3.2c.4-.1.8 0 1.1.3.4.4.4 1.1 0 1.5s-1.1.4-1.5 0c-.3-.3-.4-.7-.3-1.1L8.2 4.1l-2.6 2.6c-.4.4-.4 1.1 0 1.5l10.2 10.2c.4.4 1.1.4 1.5 0l6-6c.4-.4.4-1.1 0-1.5z M6.7 9.8c-.4-.4-1.1-.4-1.5 0s-.4 1.1 0 1.5c.3.3.7.4 1.1.3l3.2 3.2c-.1.4 0 .8.3 1.1.4.4 1.1.4 1.5 0s.4-1.1 0-1.5c-.3-.3-.7-.4-1.1-.3L6.7 9.8z"/>
  </g>
  
  <!-- Text Label -->
  <text class="badge-text" x="42" y="25">Git</text>
</svg>
