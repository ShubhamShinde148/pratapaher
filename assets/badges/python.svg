<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40">
  <defs>
    <linearGradient id="badge-python-glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="badge-python-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#3776AB" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="badge-python-glow-grad" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3776AB" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3776AB" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .badge-bg {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .badge-bg:hover {
      fill: rgba(255, 255, 255, 0.06);
      stroke: #3776AB;
      filter: drop-shadow(0 0 6px #3776AB50);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #E2E8F0;
      transition: fill 0.3s;
    }
    .badge-bg:hover + text {
      fill: #FFFFFF;
    }
  </style>
  
  <!-- Background glow -->
  <rect x="0" y="0" width="140" height="40" rx="8" fill="url(#badge-python-glow-grad)" opacity="0.8" pointer-events="none" />
  
  <!-- Outer glass panel -->
  <rect class="badge-bg" x="0.5" y="0.5" width="139" height="39" rx="7.5" fill="url(#badge-python-glass-grad)" stroke="url(#badge-python-border-grad)" stroke-width="1" />
  
  <!-- Icon Wrapper -->
  <g transform="translate(14, 10) scale(0.85)">
    <path fill="#3776AB" d="M12 2c-5.5 0-5 2.5-5 2.5v1.8h5.2v.7H6.5c-2.3 0-4.5 1.7-4.5 4.5v3.2c0 2.3 1.8 4.3 4.1 4.5h1.5v-2.2c0-2.5 2-4.5 4.5-4.5h5.2V7c0-2.8-2.5-5-5.3-5zm-1.8 1.8a.7.7 0 1 1 0 1.4.7.7 0 0 1 0-1.4z"/><path fill="#FFD343" d="M12 22c5.5 0 5-2.5 5-2.5v-1.8h-5.2v-.7h5.7c2.3 0 4.5-1.7 4.5-4.5v-3.2c0-2.3-1.8-4.3-4.1-4.5h-1.5v2.2c0 2.5-2 4.5-4.5 4.5H6.2V17c0 2.8 2.5 5 5.3 5zm1.8-1.8a.7.7 0 1 1 0-1.4.7.7 0 0 1 0 1.4z"/>
  </g>
  
  <!-- Text Label -->
  <text class="badge-text" x="42" y="25">Python</text>
</svg>
