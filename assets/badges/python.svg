<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40" role="img" aria-label="Python Badge">
  <defs>
    <!-- Light Mode Gradients -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="border-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Dark Mode Gradients -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="border-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glowing effect (Very subtle) -->
    <radialGradient id="glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3776AB" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3776AB" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .badge-bg {
      fill: url(#bg-light);
      stroke: url(#border-light);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .badge-text {
      font-family: 'Geist', 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #334155;
      transition: fill 0.3s;
    }
    
    @media (prefers-color-scheme: dark) {
      .badge-bg {
        fill: url(#bg-dark);
        stroke: url(#border-dark);
      }
      .badge-text {
        fill: #F1F5F9;
      }
    }

    /* Soft hover transitions */
    .badge-bg:hover {
      stroke: #3776AB;
      fill-opacity: 0.9;
    }
  </style>

  <!-- Faint background glow -->
  <rect x="0" y="0" width="140" height="40" rx="10" fill="url(#glow)" pointer-events="none" />

  <!-- Card Body -->
  <rect class="badge-bg" x="0.6" y="0.6" width="138.8" height="38.8" rx="9.4" stroke-width="1.2" />

  <!-- Logo (Centered inside a 24x24 box scaled at x=14, y=8) -->
  <g transform="translate(14, 8) scale(1)">
    <path fill="#3776AB" d="M12 2c-5.5 0-5 2.5-5 2.5v1.8h5.2v.7H6.5c-2.3 0-4.5 1.7-4.5 4.5v3.2c0 2.3 1.8 4.3 4.1 4.5h1.5v-2.2c0-2.5 2-4.5 4.5-4.5h5.2V7c0-2.8-2.5-5-5.3-5zm-1.8 1.8a.7.7 0 1 1 0 1.4.7.7 0 0 1 0-1.4z"/><path fill="#FFD343" d="M12 22c5.5 0 5-2.5 5-2.5v-1.8h-5.2v-.7h5.7c2.3 0 4.5-1.7 4.5-4.5v-3.2c0-2.3-1.8-4.3-4.1-4.5h-1.5v2.2c0 2.5-2 4.5-4.5 4.5H6.2V17c0 2.8 2.5 5 5.3 5zm1.8-1.8a.7.7 0 1 1 0-1.4.7.7 0 0 1 0 1.4z"/>
  </g>

  <!-- Label -->
  <text class="badge-text" x="44" y="24">Python</text>
</svg>