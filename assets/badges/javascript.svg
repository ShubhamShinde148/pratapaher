<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40" role="img" aria-label="JavaScript Badge">
  <defs>
    <!-- Light Mode Gradients -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="border-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Dark Mode Gradients -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="border-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glowing effect (Very subtle) -->
    <radialGradient id="glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F7DF1E" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F7DF1E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .badge-bg {
      fill: url(#bg-light);
      stroke: url(#border-light);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .badge-text {
      font-family: 'Geist', 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #334155;
      transition: fill 0.3s;
    }
    
    @media (prefers-color-scheme: dark) {
      .badge-bg {
        fill: url(#bg-dark);
        stroke: url(#border-dark);
      }
      .badge-text {
        fill: #F1F5F9;
      }
    }

    /* Soft hover transitions */
    .badge-bg:hover {
      stroke: #F7DF1E;
      fill-opacity: 0.9;
    }
  </style>

  <!-- Faint background glow -->
  <rect x="0" y="0" width="140" height="40" rx="10" fill="url(#glow)" pointer-events="none" />

  <!-- Card Body -->
  <rect class="badge-bg" x="0.6" y="0.6" width="138.8" height="38.8" rx="9.4" stroke-width="1.2" />

  <!-- Logo (Centered inside a 24x24 box scaled at x=14, y=8) -->
  <g transform="translate(14, 8) scale(1)">
    <rect width="24" height="24" rx="3" fill="#F7DF1E"/><path fill="#000" d="M19.8 17.6c0 1.6-.9 2.5-2.5 2.5-1.4 0-2.2-.7-2.5-1.6l1.3-.8c.2.5.5.9 1.1.9.6 0 .9-.3.9-.9V11h1.7v6.6zM14 17.5c0 1.4-1 2.5-2.6 2.5-1.5 0-2.4-.9-2.5-2.1l1.4-.8c.1.6.4 1 .1.6.5.6.8-.1.8-.7s-.3-.9-1-1.3l-.5-.3c-1.3-.7-2-1.5-2-2.7 0-1.4 1.1-2.4 2.5-2.4 1.3 0 2.1.8 2.3 1.6l-1.3.8c-.1-.4-.4-.7-.9-.7-.5 0-.7.3-.7.7 0 .4.2.6.7.9l.5.3c1.4.7 2.1 1.4 2.1 2.9z"/>
  </g>

  <!-- Label -->
  <text class="badge-text" x="44" y="24">JavaScript</text>
</svg>