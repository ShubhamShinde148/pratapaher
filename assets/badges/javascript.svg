<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40">
  <defs>
    <linearGradient id="badge-javascript-glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="badge-javascript-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#F7DF1E" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="badge-javascript-glow-grad" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F7DF1E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F7DF1E" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .badge-bg {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .badge-bg:hover {
      fill: rgba(255, 255, 255, 0.06);
      stroke: #F7DF1E;
      filter: drop-shadow(0 0 6px #F7DF1E50);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #E2E8F0;
      transition: fill 0.3s;
    }
    .badge-bg:hover + text {
      fill: #FFFFFF;
    }
  </style>
  
  <!-- Background glow -->
  <rect x="0" y="0" width="140" height="40" rx="8" fill="url(#badge-javascript-glow-grad)" opacity="0.8" pointer-events="none" />
  
  <!-- Outer glass panel -->
  <rect class="badge-bg" x="0.5" y="0.5" width="139" height="39" rx="7.5" fill="url(#badge-javascript-glass-grad)" stroke="url(#badge-javascript-border-grad)" stroke-width="1" />
  
  <!-- Icon Wrapper -->
  <g transform="translate(14, 10) scale(0.85)">
    <rect width="24" height="24" rx="3" fill="#F7DF1E"/><path fill="#000" d="M19.8 17.6c0 1.6-.9 2.5-2.5 2.5-1.4 0-2.2-.7-2.5-1.6l1.3-.8c.2.5.5.9 1.1.9.6 0 .9-.3.9-.9V11h1.7v6.6zM14 17.5c0 1.4-1 2.5-2.6 2.5-1.5 0-2.4-.9-2.5-2.1l1.4-.8c.1.6.4 1 .1.6.5.6.8-.1.8-.7s-.3-.9-1-1.3l-.5-.3c-1.3-.7-2-1.5-2-2.7 0-1.4 1.1-2.4 2.5-2.4 1.3 0 2.1.8 2.3 1.6l-1.3.8c-.1-.4-.4-.7-.9-.7-.5 0-.7.3-.7.7 0 .4.2.6.7.9l.5.3c1.4.7 2.1 1.4 2.1 2.9z"/>
  </g>
  
  <!-- Text Label -->
  <text class="badge-text" x="42" y="25">JavaScript</text>
</svg>
