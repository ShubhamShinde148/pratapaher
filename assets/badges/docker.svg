<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40">
  <defs>
    <linearGradient id="badge-docker-glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="badge-docker-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#2496ED" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="badge-docker-glow-grad" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2496ED" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2496ED" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .badge-bg {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .badge-bg:hover {
      fill: rgba(255, 255, 255, 0.06);
      stroke: #2496ED;
      filter: drop-shadow(0 0 6px #2496ED50);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #E2E8F0;
      transition: fill 0.3s;
    }
    .badge-bg:hover + text {
      fill: #FFFFFF;
    }
  </style>
  
  <!-- Background glow -->
  <rect x="0" y="0" width="140" height="40" rx="8" fill="url(#badge-docker-glow-grad)" opacity="0.8" pointer-events="none" />
  
  <!-- Outer glass panel -->
  <rect class="badge-bg" x="0.5" y="0.5" width="139" height="39" rx="7.5" fill="url(#badge-docker-glass-grad)" stroke="url(#badge-docker-border-grad)" stroke-width="1" />
  
  <!-- Icon Wrapper -->
  <g transform="translate(14, 10) scale(0.85)">
    <path fill="#2496ED" d="M13.9 8.2h-2.1V6.1h2.1v2.1zm-2.8 0H9V6.1h2.1v2.1zm-2.8 0H6.2V6.1H8.3v2.1zm8.3 0h-2.1V6.1h2.1v2.1zm5.5 1.5c-.3-1.3-1.2-2.1-2.2-2.3-.2 0-.4-.1-.6-.1-.1-.3-.4-.5-.7-.7-.3-.2-.7-.3-1.1-.3v2.8h-1.4V6.5h-2.1v2.8H9.7V6.5H7.6v2.8H5.5V7.9c-2 .1-3 1.2-3 2.9v4.2c0 2.6 2.1 4.7 4.7 4.7h9c2.4 0 4.1-1.8 4.4-4 .3-.3.4-.7.4-1.2v-4.8z"/>
  </g>
  
  <!-- Text Label -->
  <text class="badge-text" x="42" y="25">Docker</text>
</svg>
