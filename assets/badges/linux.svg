<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40">
  <defs>
    <linearGradient id="badge-linux-glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="badge-linux-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#FCC624" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="badge-linux-glow-grad" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FCC624" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FCC624" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .badge-bg {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .badge-bg:hover {
      fill: rgba(255, 255, 255, 0.06);
      stroke: #FCC624;
      filter: drop-shadow(0 0 6px #FCC62450);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #E2E8F0;
      transition: fill 0.3s;
    }
    .badge-bg:hover + text {
      fill: #FFFFFF;
    }
  </style>
  
  <!-- Background glow -->
  <rect x="0" y="0" width="140" height="40" rx="8" fill="url(#badge-linux-glow-grad)" opacity="0.8" pointer-events="none" />
  
  <!-- Outer glass panel -->
  <rect class="badge-bg" x="0.5" y="0.5" width="139" height="39" rx="7.5" fill="url(#badge-linux-glass-grad)" stroke="url(#badge-linux-border-grad)" stroke-width="1" />
  
  <!-- Icon Wrapper -->
  <g transform="translate(14, 10) scale(0.85)">
    <path fill="#FCC624" d="M12 2C9 2 6 4 6 8.5c0 3.2 1.8 6.5 4.5 7.5-.5.4-1 1-1 1.8 0 1 .8 1.7 1.8 1.7h1.4c1 0 1.8-.8 1.8-1.7 0-.8-.5-1.4-1-1.8 2.7-1 4.5-4.3 4.5-7.5C18 4 15 2 12 2zm-2.5 5c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1zm5 0c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1zm-2.5 6.5c-1.5 0-2.5-1-2.5-2.5h5c0 1.5-1 2.5-2.5 2.5z"/>
  </g>
  
  <!-- Text Label -->
  <text class="badge-text" x="42" y="25">Linux</text>
</svg>
