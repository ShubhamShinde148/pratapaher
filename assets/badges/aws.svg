<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40">
  <defs>
    <linearGradient id="badge-aws-glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="badge-aws-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#FF9900" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="badge-aws-glow-grad" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FF9900" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF9900" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .badge-bg {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .badge-bg:hover {
      fill: rgba(255, 255, 255, 0.06);
      stroke: #FF9900;
      filter: drop-shadow(0 0 6px #FF990050);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #E2E8F0;
      transition: fill 0.3s;
    }
    .badge-bg:hover + text {
      fill: #FFFFFF;
    }
  </style>
  
  <!-- Background glow -->
  <rect x="0" y="0" width="140" height="40" rx="8" fill="url(#badge-aws-glow-grad)" opacity="0.8" pointer-events="none" />
  
  <!-- Outer glass panel -->
  <rect class="badge-bg" x="0.5" y="0.5" width="139" height="39" rx="7.5" fill="url(#badge-aws-glass-grad)" stroke="url(#badge-aws-border-grad)" stroke-width="1" />
  
  <!-- Icon Wrapper -->
  <g transform="translate(14, 10) scale(0.85)">
    <path fill="#FF9900" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm3.6 13c-.3.6-.8 1.1-1.5 1.4-.7.3-1.5.5-2.4.5s-1.7-.2-2.4-.5c-.7-.3-1.2-.8-1.5-1.4h7.8zm1.2-4c0 1-.3 1.8-1 2.4-.7.6-1.6.9-2.8.9s-2.1-.3-2.8-.9c-.7-.6-1-1.4-1-2.4 0-1 .3-1.8 1-2.4.7-.6 1.6-.9 2.8-.9s2.1.3 2.8.9c.7.6 1 1.4 1 2.4z"/>
  </g>
  
  <!-- Text Label -->
  <text class="badge-text" x="42" y="25">AWS</text>
</svg>
