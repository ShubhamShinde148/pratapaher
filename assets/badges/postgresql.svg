<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40">
  <defs>
    <linearGradient id="badge-postgresql-glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="badge-postgresql-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#336791" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="badge-postgresql-glow-grad" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#336791" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#336791" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .badge-bg {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .badge-bg:hover {
      fill: rgba(255, 255, 255, 0.06);
      stroke: #336791;
      filter: drop-shadow(0 0 6px #33679150);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #E2E8F0;
      transition: fill 0.3s;
    }
    .badge-bg:hover + text {
      fill: #FFFFFF;
    }
  </style>
  
  <!-- Background glow -->
  <rect x="0" y="0" width="140" height="40" rx="8" fill="url(#badge-postgresql-glow-grad)" opacity="0.8" pointer-events="none" />
  
  <!-- Outer glass panel -->
  <rect class="badge-bg" x="0.5" y="0.5" width="139" height="39" rx="7.5" fill="url(#badge-postgresql-glass-grad)" stroke="url(#badge-postgresql-border-grad)" stroke-width="1" />
  
  <!-- Icon Wrapper -->
  <g transform="translate(14, 10) scale(0.85)">
    <path fill="#336791" d="M12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.7 1.5 5.2.2.4.6.6 1.1.4.4-.2.6-.7.4-1.1C4.3 15.3 4 13.7 4 12c0-4.4 3.6-8 8-8s8 3.6 8 8c0 2.2-.9 4.3-2.5 5.8l-1.4-1.4c.3-.3.5-.7.5-1.2v-2.1c0-1.7-1.3-3-3-3H9c-1.7 0-3 1.3-3 3v2.1c0 .5.2.9.5 1.2l-1.4 1.4c-.4.4-.4 1.1 0 1.5s1.1.4 1.5 0l1.4-1.4c.3.2.7.3 1.1.3h4.8c.4 0 .8-.1 1.1-.3l1.4 1.4c.4.4 1.1.4 1.5 0s.4-1.1 0-1.5L18.5 17c1.6-1.5 2.5-3.6 2.5-6 0-5.5-4.5-10-10-10z M9 11h3c.6 0 1 .4 1 1v1.5h-5V12c0-.6.4-1 1-1z"/>
  </g>
  
  <!-- Text Label -->
  <text class="badge-text" x="42" y="25">PostgreSQL</text>
</svg>
