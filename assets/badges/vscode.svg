<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40">
  <defs>
    <linearGradient id="badge-vscode-glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="badge-vscode-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#007ACC" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="badge-vscode-glow-grad" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#007ACC" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#007ACC" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .badge-bg {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .badge-bg:hover {
      fill: rgba(255, 255, 255, 0.06);
      stroke: #007ACC;
      filter: drop-shadow(0 0 6px #007ACC50);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #E2E8F0;
      transition: fill 0.3s;
    }
    .badge-bg:hover + text {
      fill: #FFFFFF;
    }
  </style>
  
  <!-- Background glow -->
  <rect x="0" y="0" width="140" height="40" rx="8" fill="url(#badge-vscode-glow-grad)" opacity="0.8" pointer-events="none" />
  
  <!-- Outer glass panel -->
  <rect class="badge-bg" x="0.5" y="0.5" width="139" height="39" rx="7.5" fill="url(#badge-vscode-glass-grad)" stroke="url(#badge-vscode-border-grad)" stroke-width="1" />
  
  <!-- Icon Wrapper -->
  <g transform="translate(14, 10) scale(0.85)">
    <path fill="#007ACC" d="M23.9 6.5L18.4 1c-.3-.3-.8-.3-1.1 0l-8.4 8.4L3.4 4.7c-.3-.3-.8-.3-1.1 0L.1 6.8c-.2.2-.2.6 0 .8l5.2 4.4L.1 16.4c-.2.2-.2.6 0 .8l2.2 2.1c.3.3.8.3 1.1 0l5.5-4.7 8.4 8.4c.3.3.8.3 1.1 0l5.5-5.5c.3-.3.3-.8 0-1.1L18.7 12l5.2-4.4c.2-.2.2-.6 0-.8z M17.5 15.6L12 12l5.5-3.6v7.2z"/>
  </g>
  
  <!-- Text Label -->
  <text class="badge-text" x="42" y="25">VS Code</text>
</svg>
